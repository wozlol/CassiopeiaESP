<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>woz.lol</title>
<style>
:root{--bg:#0b0d0b;--fg:#d6e8d0;--dim:#8a9a86;--acc:#9dff6a;--card:#141814;--line:#263026;--bad:#ff7a7a}
@media (prefers-color-scheme: light){:root{--bg:#f4f6f1;--fg:#1d261b;--dim:#5b6858;--acc:#2f7d12;--card:#fff;--line:#d3dbd0;--bad:#b32121}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,sans-serif}
main{max-width:56rem;margin:0 auto;padding:1rem}
h1{font-size:1.3rem;margin:.2rem 0 .8rem;display:flex;align-items:center;gap:.6rem}a{color:var(--acc)}
.logo{width:2.2rem;height:2.2rem;fill:var(--fg);flex:none}h1 a{display:inline-flex}
footer{margin:2rem 0 .5rem;padding-top:.8rem;border-top:1px solid var(--line);color:var(--dim);font-size:.85rem;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}footer .logo{width:1.2rem;height:1.2rem;fill:var(--dim)}footer a{color:var(--dim)}footer a:hover{color:var(--acc)}
.bar{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin:.6rem 0}
button,select,input,textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:.35rem .7rem}
button{cursor:pointer}button:hover{border-color:var(--acc)}button.go{background:var(--acc);color:#0b0d0b;border-color:var(--acc)}
.tabs button{border-radius:6px 6px 0 0}.tabs button.on{border-color:var(--acc);color:var(--acc)}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:6px}
td,th{padding:.35rem .6rem;border-bottom:1px solid var(--line);text-align:left}th{color:var(--dim);font-weight:500}
td.n{word-break:break-all}td.s,td.a{white-space:nowrap}td.s{color:var(--dim);text-align:right}
.drop{border:2px dashed var(--line);border-radius:8px;padding:1rem;text-align:center;color:var(--dim);margin:.6rem 0}.drop.over{border-color:var(--acc);color:var(--acc)}
.msg{min-height:1.4rem;color:var(--dim)}.bad{color:var(--bad)}
.clip{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:.5rem;margin:.5rem 0}.clip textarea{width:100%;min-height:3.2rem}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:.3rem 0}.prog i{display:block;height:100%;background:var(--acc);width:0}
#login{max-width:20rem;margin:20vh auto}#login input{width:100%;margin:.6rem 0;font-size:1.3rem;letter-spacing:.3em;text-align:center}
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="wl" viewBox="0 0 566.93 566.93"><path fill-rule="evenodd" d="M536.6,30.33h-149.69c-.76,8.42-1.67,20.33-2.38,31.66-1.09,17.33-2.43,34.42-2.98,38-1.05,6.85-1.72,14.39-5.01,56.5-2.82,36.07-4.99,63.11-6.07,75.5-.5,5.77-1.2,14.55-1.55,19.5s-1.04,11.17-1.53,13.83c-.83,4.45-2.17,21.45-3.78,47.67-.63,10.32-.69,10.51-3.2,10.8-1.5.17-3.72-.62-5.38-1.93-2.52-1.98-31.18-20.82-45.51-29.92-2.99-1.9-10.39-6.72-16.43-10.71-6.04-3.99-11.61-7.25-12.37-7.25s-8.44,4.65-17.07,10.34c-29.93,19.73-44.71,29.33-50.81,32.98-3.37,2.02-6.69,4.35-7.37,5.17-.69.83-2.53,1.5-4.11,1.5-2.21,0-3-.56-3.49-2.5-.35-1.37-.38-3.14-.08-3.92.52-1.35-.18-11.29-3.8-54.08-.84-9.9-1.97-24.75-2.52-33s-1.67-21.98-2.5-30.5c-.83-8.53-2.18-22.48-3.01-31-.83-8.53-1.97-22.7-2.53-31.5-1.62-25.31-2.92-41.91-4.46-57-.79-7.7-1.91-20.08-2.5-27.5-.65-8.25-1.31-15.33-2.1-22.66H30.33v506.27h506.27V30.33ZM210.99,370.06c3.04-1.72,12.38-7.57,20.75-13,8.37-5.43,19.64-12.73,25.05-16.22,5.41-3.49,12.82-8.48,16.47-11.1,3.65-2.61,7.01-4.75,7.45-4.75s5.41,3.1,11.03,6.9c18.71,12.63,49.2,32.36,61.53,39.83,3.41,2.06,2.47,5.29-2.31,8.03-2.2,1.26-9.28,5.77-15.75,10.02-23.79,15.65-49.95,32.76-52.2,34.16-2.2,1.36-3.16.88-18.8-9.5-9.07-6.02-24.89-16.34-35.15-22.94-22.35-14.37-23.6-15.27-23.6-16.98,0-.73,2.49-2.74,5.53-4.45ZM435.96,421.19l-2.5,1.99c-2.23,1.78-14.69,9.92-43.24,28.26-5.09,3.27-16.91,10.95-26.26,17.06s-26.34,17.16-37.77,24.55c-11.42,7.39-25.81,16.76-31.98,20.81-6.17,4.05-12.12,7.42-13.23,7.48s-10.12-5.19-20.02-11.67c-9.9-6.48-28.8-18.78-42-27.34-13.2-8.56-28.95-18.82-35-22.82-6.05-3.99-15.5-10.16-21-13.7-28.54-18.38-35.67-23.28-36.68-25.16-1.12-2.09-1.26-41.14-.16-42.92.72-1.17,2.51-.4,7.59,3.27,4.39,3.17,6.29,4.42,45.75,30.03,12.92,8.39,29.12,18.93,36,23.42,6.88,4.49,17.67,11.52,23.99,15.6,6.32,4.09,17.74,11.6,25.38,16.68s14.86,9.25,16.06,9.25,4.85-1.93,8.12-4.28c3.27-2.36,9.78-6.71,14.45-9.66,11.01-6.97,21.46-13.74,43-27.9,9.62-6.32,22-14.28,27.5-17.69,5.5-3.41,16.34-10.42,24.1-15.58s17.43-11.54,21.5-14.17c4.07-2.63,8.93-5.89,10.8-7.25,2.18-1.58,3.79-2.14,4.5-1.55.74.61,1.1,7.89,1.1,22.1v21.18Z"/></symbol></svg>
<main>
<div id="login" hidden><h1><a href="https://woz.lol" target="_blank" rel="noopener" aria-label="woz.lol"><svg class="logo"><use href="#wl"/></svg></a>woz.lol</h1><div>Type the code shown on the device, GUI menu, Web admin.</div><input id="code" inputmode="numeric" autocomplete="off" maxlength="6"><button class="go" id="loginbtn" style="width:100%">Open</button><div class="msg bad" id="lmsg"></div></div>
<div id="app" hidden>
<h1><a href="https://woz.lol" target="_blank" rel="noopener" aria-label="woz.lol"><svg class="logo"><use href="#wl"/></svg></a>woz.lol <span id="info" style="font-size:.85rem;color:var(--dim);font-weight:400"></span></h1>
<div class="tabs"><button id="t1" class="on">SD card files</button> <button id="t2">Clipboard</button></div>
<section id="files">
 <div class="bar"><b id="crumbs"></b><span style="flex:1"></span><button id="up">Up</button><button id="mk">New folder</button><button id="rf">Refresh</button></div>
 <div class="drop" id="drop">Drop files here to put them in this folder, or <label><a href="#" id="pick">choose files</a><input id="file" type="file" multiple hidden></label></div>
 <div id="prog"></div><div class="msg" id="msg"></div>
 <table><thead><tr><th>Name</th><th style="text-align:right">Size</th><th></th></tr></thead><tbody id="rows"></tbody></table>
</section>
<section id="clips" hidden>
 <div class="bar"><button class="go" id="addclip">Add a clip</button><button id="rfc">Refresh</button></div>
 <div class="msg" id="cmsg"></div><div id="cl"></div>
</section>
</div><footer><a href="https://woz.lol" target="_blank" rel="noopener" aria-label="woz.lol"><svg class="logo"><use href="#wl"/></svg></a><span><a href="https://woz.lol" target="_blank" rel="noopener">woz.lol</a> handheld web admin</span><span id="ver"></span></footer>
</main>
<script>
const H={'X-A11':'1'};let dir='';
const $=id=>document.getElementById(id);
async function api(path,opt={}){opt.headers=Object.assign({},H,opt.headers||{});const r=await fetch(path,opt);if(r.status===401){showLogin();throw new Error('login')}if(!r.ok){const t=await r.text();throw new Error(t||r.status)}return r}
function showLogin(){$('app').hidden=true;$('login').hidden=false;$('code').focus()}
function fmt(n){if(n<1024)return n+' B';if(n<1048576)return (n/1024).toFixed(0)+' KB';if(n<1073741824)return (n/1048576).toFixed(1)+' MB';return (n/1073741824).toFixed(2)+' GB'}
function say(el,t,bad){el.textContent=t;el.className='msg'+(bad?' bad':'')}
async function login(){try{const r=await fetch('/api/login',{method:'POST',headers:H,body:$('code').value});if(!r.ok){say($('lmsg'),await r.text(),true);return}$('login').hidden=true;start()}catch(e){say($('lmsg'),String(e),true)}}
async function info(){const j=await (await api('/api/info')).json();$('ver').textContent=j.version?'v'+j.version:'';$('info').textContent=j.free!==undefined?`${fmt(j.free)} free of ${fmt(j.total)}  ·  running ${j.running}`:''}
function crumbs(){const parts=dir?dir.split('/'):[];let h='<a href="#" data-d="">card</a>',p='';for(const x of parts){p+=(p?'/':'')+x;h+=' / <a href="#" data-d="'+p+'">'+x+'</a>'}$('crumbs').innerHTML=h;$('crumbs').querySelectorAll('a').forEach(a=>a.onclick=e=>{e.preventDefault();go(a.dataset.d)})}
async function go(d){dir=d;crumbs();say($('msg'),'');const rows=$('rows');rows.innerHTML='';
 try{const j=await (await api('/api/ls?dir='+encodeURIComponent(dir))).json();
 j.items.sort((a,b)=>(b.d?1:0)-(a.d?1:0)||a.n.localeCompare(b.n));
 for(const it of j.items){const tr=document.createElement('tr');const full=(dir?dir+'/':'')+it.n;
  const n=document.createElement('td');n.className='n';
  if(it.d){const a=document.createElement('a');a.href='#';a.textContent=it.n+'/';a.onclick=e=>{e.preventDefault();go(full)};n.appendChild(a)}
  else{const a=document.createElement('a');a.href='/api/file?path='+encodeURIComponent(full);a.textContent=it.n;n.appendChild(a)}
  const s=document.createElement('td');s.className='s';s.textContent=it.d?'':fmt(it.s);
  const ac=document.createElement('td');ac.className='a';
  if(!it.d&&dir==='modes'&&/\.bin$/i.test(it.n)){const sel=document.createElement('select');for(let i=1;i<=4;i++){const o=document.createElement('option');o.value=i;o.textContent='slot '+i;sel.appendChild(o)}const b=document.createElement('button');b.textContent='Install';b.onclick=()=>install(full,sel.value);ac.appendChild(sel);ac.appendChild(b);ac.append(' ')}
  const del=document.createElement('button');del.textContent='Delete';del.onclick=()=>remove(full,it.d);ac.appendChild(del);
  tr.append(n,s,ac);rows.appendChild(tr)}
 if(!j.items.length)rows.innerHTML='<tr><td colspan="3" style="color:var(--dim)">Empty</td></tr>';
 }catch(e){if(e.message!=='login')say($('msg'),String(e.message),true)}}
async function remove(p,isdir){if(!confirm('Delete '+p+(isdir?' and everything in it':'')+'? This cannot be undone.'))return;try{await api('/api/'+(isdir?'dir':'file')+'?path='+encodeURIComponent(p),{method:'DELETE'});go(dir);info()}catch(e){say($('msg'),String(e.message),true)}}
async function install(p,slot){say($('msg'),'Installing '+p+' in slot '+slot+', this takes up to a minute');try{const t=await (await api('/api/install?path='+encodeURIComponent(p)+'&slot='+slot,{method:'POST'})).text();say($('msg'),t)}catch(e){say($('msg'),String(e.message),true)}}
function upload(files){if(!dir){say($('msg'),'Open modes, library or media first, files go into a folder.',true);return}
 let i=0;const next=()=>{if(i>=files.length){go(dir);info();return}const f=files[i++];const path=(dir+'/'+f.name);
  const x=new XMLHttpRequest();x.open('PUT','/api/file?path='+encodeURIComponent(path));x.setRequestHeader('X-A11','1');
  const bar=document.createElement('div');bar.className='prog';bar.innerHTML='<i></i>';$('prog').innerHTML='';$('prog').appendChild(bar);
  x.upload.onprogress=e=>{bar.firstChild.style.width=(e.loaded*100/e.total)+'%';say($('msg'),'Sending '+f.name+'  '+fmt(e.loaded)+' of '+fmt(e.total))};
  x.onload=()=>{if(x.status===401){showLogin();return}if(x.status>=300){say($('msg'),f.name+': '+x.responseText,true);return}next()};
  x.onerror=()=>say($('msg'),'The connection dropped while sending '+f.name,true);x.send(f)};next()}
async function mkdir(){if(!dir){say($('msg'),'Open modes, library or media first.',true);return}const n=prompt('Name of the new folder');if(!n)return;try{await api('/api/mkdir?path='+encodeURIComponent(dir+'/'+n),{method:'POST'});go(dir)}catch(e){say($('msg'),String(e.message),true)}}
async function clips(){const j=await (await api('/api/clips')).json();const box=$('cl');box.innerHTML='';
 j.clips.forEach((t,i)=>{const d=document.createElement('div');d.className='clip';const ta=document.createElement('textarea');ta.value=t;
  const save=document.createElement('button');save.textContent='Save';save.onclick=async()=>{try{await api('/api/clips/'+(i+1),{method:'PUT',body:ta.value});say($('cmsg'),'Saved clip '+(i+1))}catch(e){say($('cmsg'),String(e.message),true)}};
  const del=document.createElement('button');del.textContent='Delete';del.onclick=async()=>{if(confirm('Delete clip '+(i+1)+'?')){await api('/api/clips/'+(i+1),{method:'DELETE'});clips()}};
  const cp=document.createElement('button');cp.textContent='Copy here';cp.onclick=()=>navigator.clipboard&&navigator.clipboard.writeText(ta.value);
  const bar=document.createElement('div');bar.className='bar';bar.append(document.createTextNode('Clip '+(i+1)),save,cp,del);d.append(bar,ta);box.appendChild(d)});
 if(!j.clips.length)box.innerHTML='<div class="msg">The clipboard is empty.</div>'}
async function addclip(){const t=prompt('Text for the new clip');if(!t)return;try{await api('/api/clips',{method:'POST',body:t});clips()}catch(e){say($('cmsg'),String(e.message),true)}}
function tab(n){$('files').hidden=n!==1;$('clips').hidden=n!==2;$('t1').className=n===1?'on':'';$('t2').className=n===2?'on':'';if(n===2)clips()}
async function start(){try{await info();$('app').hidden=false;$('login').hidden=true;go('')}catch(e){}}
$('loginbtn').onclick=login;$('code').onkeydown=e=>{if(e.key==='Enter')login()};
$('t1').onclick=()=>tab(1);$('t2').onclick=()=>tab(2);$('rf').onclick=()=>go(dir);$('rfc').onclick=clips;$('addclip').onclick=addclip;$('mk').onclick=mkdir;
$('up').onclick=()=>go(dir.includes('/')?dir.slice(0,dir.lastIndexOf('/')):'');
$('pick').onclick=e=>{e.preventDefault();$('file').click()};$('file').onchange=e=>upload([...e.target.files]);
const dz=$('drop');dz.ondragover=e=>{e.preventDefault();dz.classList.add('over')};dz.ondragleave=()=>dz.classList.remove('over');dz.ondrop=e=>{e.preventDefault();dz.classList.remove('over');upload([...e.dataTransfer.files])};
start();
</script></body></html>
